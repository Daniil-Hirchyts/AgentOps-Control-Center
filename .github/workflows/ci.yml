name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Test-only values. Never reuse outside CI.
  DATABASE_URL: postgres://agentops:agentops@localhost:5432/agentops
  JWT_SECRET: ci-only-jwt-secret-not-for-production-0123456789abcdef
  LLM_MODE: mock
  COOKIE_SECURE: "false"
  RUST_LOG: agentops=info,tower_http=warn
  NODE_VERSION: "24"
  PNPM_VERSION: "9"

jobs:
  backend:
    name: Backend (fmt, clippy, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agentops
          POSTGRES_PASSWORD: agentops
          POSTGRES_DB: agentops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentops"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli

      # Schema must exist before compile-time checked queries (sqlx::query!) are built.
      - name: Apply migrations
        run: sqlx migrate run --source migrations

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --locked --all-targets

      # Fails if the committed OpenAPI document no longer matches the code.
      - name: OpenAPI drift check
        run: |
          cargo run --locked --quiet --bin export_openapi
          git diff --exit-code -- ../contracts/openapi/openapi.json

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end (Playwright, two browser contexts)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agentops
          POSTGRES_PASSWORD: agentops
          POSTGRES_DB: agentops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentops"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      BIND_ADDR: 127.0.0.1:8080
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      BASE_URL: http://localhost:5173
      E2E_BASE_URL: http://localhost:5173
      PLAYWRIGHT_BASE_URL: http://localhost:5173
      E2E_API_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          shared-key: e2e

      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli

      - name: Apply migrations
        working-directory: backend
        run: sqlx migrate run --source migrations

      - name: Build backend
        working-directory: backend
        run: cargo build --locked --release --bins

      - name: Start backend (LLM_MODE=mock)
        working-directory: backend
        run: |
          nohup ./target/release/agentops > "$RUNNER_TEMP/backend.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/health > /dev/null; then echo "backend up"; exit 0; fi
            sleep 1
          done
          echo "backend did not become healthy"; cat "$RUNNER_TEMP/backend.log"; exit 1

      - name: Seed demo data
        working-directory: backend
        run: ./target/release/seed

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            apps/web/pnpm-lock.yaml
            tests/e2e/pnpm-lock.yaml

      - name: Build and serve frontend (vite preview proxies /api and /ws)
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          nohup pnpm exec vite preview --host 127.0.0.1 --port 5173 --strictPort > "$RUNNER_TEMP/web.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:5173/ > /dev/null; then echo "web up"; exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/web.log"; exit 1

      # tests/e2e is either its own pnpm package or a config consumed from apps/web.
      - name: Run Playwright
        run: |
          if [ -f tests/e2e/package.json ]; then
            cd tests/e2e
            pnpm install --frozen-lockfile
            pnpm exec playwright install --with-deps chromium
            pnpm exec playwright test
          else
            cd apps/web
            pnpm exec playwright install --with-deps chromium
            pnpm exec playwright test --config ../../tests/e2e/playwright.config.ts
          fi

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload server logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            ${{ runner.temp }}/backend.log
            ${{ runner.temp }}/web.log
